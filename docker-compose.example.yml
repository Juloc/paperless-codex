services:
  paperless-codex:
    image: ghcr.io/juloc/paperless-codex:${PAPERLESS_CODEX_VERSION:-0.1.5}
    restart: unless-stopped
    depends_on:
      - webserver
    ports:
      - "127.0.0.1:8484:8080"
    environment:
      PAPERLESS_URL: http://webserver:8000
      PAPERLESS_TOKEN: ${PAPERLESS_CODEX_TOKEN:?PAPERLESS_CODEX_TOKEN is required}
      BRIDGE_KEY: ${PAPERLESS_CODEX_BRIDGE_KEY:?PAPERLESS_CODEX_BRIDGE_KEY is required}
      CODEX_HOME: /data/codex
      CODEX_WORKDIR: /tmp/paperless-codex
      STATE_DIR: /data/state
      PAPERLESS_CODEX_VERSION: ${PAPERLESS_CODEX_VERSION:-0.1.5}
      PAPERLESS_CODEX_PIPELINE_VERSION: "7"
      PROVENANCE_TAGS: "false"
      PROVENANCE_CUSTOM_FIELD: "true"
      PROVENANCE_FIELD_NAME: AI Provenienz
      MAX_SEMANTIC_TAGS: "2"
      VERIFY_PAPERLESS_WRITES: "true"
      AUTO_DISCOVERY: "true"
      DISCOVERY_INTERVAL_MS: "60000"
      DISCOVERY_PAGE_SIZE: "200"
      USAGE_LIMIT_RETRY_MS: "1800000"
      MAX_DOCUMENT_BYTES: "52428800"
      MAX_PAGES: "20"
      PDF_DPI: "150"
      CODEX_TIMEOUT_MS: "360000"
      MIN_CONFIDENCE: "0.55"
      AUTO_APPLY_CONFIDENCE: "0.80"
      MAX_RETRIES: "2"
      RETRY_DELAY_MS: "15000"
      OCR_MIN_CONFIDENCE: "0.70"
      OCR_REPLACE_MODE: validated
      CODEX_MODEL: ${PAPERLESS_CODEX_MODEL:-}
      WRITE_CONTENT: "true"
      CREATE_MISSING_METADATA: "true"
      EXISTING_MATCH_THRESHOLD: "0.86"
      OVERWRITE_CUSTOM_FIELDS: "false"
    volumes:
      - paperless_codex_data:/data/codex
      - paperless_codex_state:/data/state
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - paperlessnet
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  paperless_codex_data:
  paperless_codex_state:
