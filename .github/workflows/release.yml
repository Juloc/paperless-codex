name: Release container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag, for example 0.1.7
        required: true
        default: 0.1.7

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/juloc/paperless-codex:${{ inputs.version }}
            ghcr.io/juloc/paperless-codex:latest